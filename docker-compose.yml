# Chege Photos Platform — Unified Multi-Container Compose
# Usage:
#   bash scripts/deploy.sh
#   docker compose up --build -d
#
# Production Standard Ports:
#   - caddy:  Port 80 (HTTP) & Port 443 (HTTPS/HTTP3 — https://chegephotos.local)
#   - web:    Internal 9000 (PHP 8.4.28 NTS FPM + OPcache JIT)
#   - mysql:  Port 3306 (MySQL 8.4 Relational Database)
#   - ml:     Port 8000 (FastAPI CV + SigLIP + Florence-2 + Whisper Large-v3-Turbo)
#   - redis:  Port 6379 (Redis 7 In-Memory Cache, Sessions & Job Queue Broker)
#   - qdrant: Port 6333 (Qdrant Vector Database HTTP) / 6334 (gRPC)
#   - minio:  Port 9000 (MinIO S3 API) / Port 9001 (MinIO Console)
#   - dozzle: Port 8888 (Real-Time Container Log Viewer)

name: chege-photos

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

services:
  mysql:
    image: mysql:26.7
    container_name: chege-photos-mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-db_chege_photos}
    command: >
      mysqld
      --sql-mode="STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"
      --log-error-verbosity=3
      --slow_query_log=1
      --long_query_time=2
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_password}"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    volumes:
      - chege-photos-mysql:/var/lib/mysql
    networks:
      chege-photos-net:
        aliases:
          - mysql
          - shared-mysql
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: chege-photos-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - chege-photos-redis:/data
    networks:
      chege-photos-net:
        aliases:
          - redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: chege-photos-qdrant
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    environment:
      QDRANT__LOG_LEVEL: INFO
    volumes:
      - chege-photos-qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333'"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 3s
    networks:
      chege-photos-net:
        aliases:
          - qdrant
          - ml-qdrant
    logging: *default-logging
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: chege-photos-minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_password123}
    volumes:
      - chege-photos-minio:/data
    networks:
      chege-photos-net:
        aliases:
          - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 2s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    container_name: chege-photos-minio-init
    user: "0"
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minio_admin} ${MINIO_ROOT_PASSWORD:-minio_password123}); do echo 'Waiting for MinIO...'; sleep 1; done;
      /usr/bin/mc mb --ignore-existing myminio/${S3_BUCKET:-chege-photos};
      /usr/bin/mc mb --ignore-existing myminio/${S3_MODELS_BUCKET:-chege-models};
      /usr/bin/mc mb --ignore-existing myminio/${S3_BACKUPS_BUCKET:-chege-backups};
      /usr/bin/mc anonymous set download myminio/${S3_BUCKET:-chege-photos}/thumbnails;
      echo 'MinIO buckets (photos, models, backups) initialized successfully';
      exit 0;
      "
    networks:
      - chege-photos-net
    logging: *default-logging

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: chege-photos/web:latest
    container_name: chege-photos-web
    environment:
      CI_ENVIRONMENT: ${CI_ENVIRONMENT:-development}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: ${DB_ROOT_PASSWORD:-root_password}
      DB_NAME: ${DB_NAME:-db_chege_photos}
      database.default.hostname: mysql
      database.default.database: ${DB_NAME:-db_chege_photos}
      database.default.username: root
      database.default.password: ${DB_ROOT_PASSWORD:-root_password}
      database.default.port: 3306
      ML_URL: ${ML_URL:-http://ml:8000}
      ML_API_KEY: ${ML_API_KEY:-my_super_secret_shared_token_key_123!}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_DRIVER: ${STORAGE_DRIVER:-minio}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-chege-photos}
      S3_MODELS_BUCKET: ${S3_MODELS_BUCKET:-chege-models}
      S3_BACKUPS_BUCKET: ${S3_BACKUPS_BUCKET:-chege-backups}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio_admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minio_password123}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-true}
      STATELESS_MINIO_PRIMARY: "true"
    volumes:
      - ./web:/var/www/html
      - chege-photos-web-vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9000'"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 8s
    networks:
      chege-photos-net:
        aliases:
          - web
          - php-fpm
    logging: *default-logging
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: chege-photos-caddy
    ports:
      - "${HTTP_PORT:-${WEB_PORT:-80}}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web/public:/var/www/html/public:ro
      - chege-photos-caddy-data:/data
      - chege-photos-caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/api/v1/health || exit 1"]
      interval: 4s
      timeout: 3s
      retries: 8
      start_period: 5s
    networks:
      chege-photos-net:
        aliases:
          - caddy
          - chegephotos.local
          - chege-photos-webapp
    logging: *default-logging
    restart: unless-stopped

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    image: chege-photos/ml:latest
    container_name: chege-photos-ml
    ports:
      - "${ML_PORT:-8000}:8000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      DB_NAME: ${DB_NAME:-db_chege_photos}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION: face_embeddings
      REDIS_URL: redis://redis:6379/0
      FACE_MODEL_PACK: buffalo_l
      FACE_DET_THRESH: 0.5
      INCLUDE_SENSITIVE_ATTRIBUTES: "false"
      HDBSCAN_MIN_CLUSTER_SIZE: 2
      HDBSCAN_MIN_SAMPLES: 1
      CLUSTER_METRIC: cosine
      SCAN_STALE_TIMEOUT_SEC: 300
      HOST: 0.0.0.0
      PORT: 8000
      LOG_LEVEL: info
      ML_API_KEY: ${ML_API_KEY:-my_super_secret_shared_token_key_123!}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-minio}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-chege-photos}
      S3_MODELS_BUCKET: ${S3_MODELS_BUCKET:-chege-models}
      S3_BACKUPS_BUCKET: ${S3_BACKUPS_BUCKET:-chege-backups}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio_admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minio_password123}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-true}
      STATELESS_MINIO_PRIMARY: "true"
      SIGLIP_MODEL_NAME: ${SIGLIP_MODEL_NAME:-google/siglip-base-patch16-224}
      FLORENCE_MODEL_NAME: ${FLORENCE_MODEL_NAME:-microsoft/Florence-2-base}
      WHISPER_MODEL_NAME: ${WHISPER_MODEL_NAME:-large-v3-turbo}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      ML_DEVICE: ${ML_DEVICE:-cpu}
      ML_IDLE_UNLOAD_SEC: ${ML_IDLE_UNLOAD_SEC:-300}
    volumes:
      - ./ml/app:/app/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request, sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8000/health\").getcode() == 200 else 1)'"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 5s
    networks:
      chege-photos-net:
        aliases:
          - ml
          - ml-chege-photos
    logging: *default-logging
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:latest
    container_name: chege-photos-dozzle
    ports:
      - "${DOZZLE_PORT:-8888}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOZZLE_LEVEL: info
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_AUTH_PROVIDER: ${DOZZLE_AUTH_PROVIDER:-}
      DOZZLE_USERS: ${DOZZLE_USERS:-}
    networks:
      chege-photos-net:
        aliases:
          - dozzle
    logging: *default-logging
    restart: unless-stopped

volumes:
  chege-photos-mysql:
  chege-photos-qdrant:
  chege-photos-redis:
  chege-photos-minio:
  chege-photos-web-vendor:
  chege-photos-caddy-data:
  chege-photos-caddy-config:

networks:
  chege-photos-net:
    name: chege-photos-net
