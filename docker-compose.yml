# Chege Photos Platform — Unified Multi-Container Compose
# Usage:
#   docker compose up --build -d
#
# Production Standard Ports:
#   - web:    Port 80   (HTTP Web Dashboard & Mobile REST Gateway)
#   - mysql:  Port 3306 (MySQL 8.4 Relational Database)
#   - ml:     Port 8000 (FastAPI Computer Vision Microservice)
#   - redis:  Port 6379 (Redis In-Memory Cache & Job Queue Broker)
#   - qdrant: Port 6333 (Qdrant Vector Database HTTP) / 6334 (gRPC)

services:
  mysql:
    image: mysql:8.4
    container_name: chege-mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-db_chege_photos}
    command: --sql-mode="STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_password}"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      chege-network:
        aliases:
          - mysql
          - shared-mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: chege-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      chege-network:
        aliases:
          - redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: chege-qdrant
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333'"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 3s
    networks:
      chege-network:
        aliases:
          - qdrant
          - ml-qdrant
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: chege-photos-web:latest
    container_name: chege-photos-web
    ports:
      - "${WEB_PORT:-80}:80"
    environment:
      CI_ENVIRONMENT: ${CI_ENVIRONMENT:-development}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: ${DB_ROOT_PASSWORD:-root_password}
      DB_NAME: ${DB_NAME:-db_chege_photos}
      database.default.hostname: mysql
      database.default.database: ${DB_NAME:-db_chege_photos}
      database.default.username: root
      database.default.password: ${DB_ROOT_PASSWORD:-root_password}
      database.default.port: 3306
      ML_URL: ${ML_URL:-http://ml:8000}
      ML_API_KEY: ${ML_API_KEY:-my_super_secret_shared_token_key_123!}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./web:/var/www/html
      - web-vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://localhost/api/v1/health\") !== false ? 0 : 1);'"]
      interval: 4s
      timeout: 3s
      retries: 5
      start_period: 8s
    networks:
      chege-network:
        aliases:
          - web
          - chege-photos-webapp
    restart: unless-stopped

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    image: chege-photos-ml:latest
    container_name: chege-photos-ml
    ports:
      - "${ML_PORT:-8000}:8000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      DB_NAME: ${DB_NAME:-db_chege_photos}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION: face_embeddings
      REDIS_URL: redis://redis:6379/0
      FACE_MODEL_PACK: buffalo_l
      FACE_DET_THRESH: 0.5
      INCLUDE_SENSITIVE_ATTRIBUTES: "false"
      HDBSCAN_MIN_CLUSTER_SIZE: 2
      HDBSCAN_MIN_SAMPLES: 1
      CLUSTER_METRIC: cosine
      SCAN_STALE_TIMEOUT_SEC: 300
      HOST: 0.0.0.0
      PORT: 8000
      LOG_LEVEL: info
      ML_API_KEY: ${ML_API_KEY:-my_super_secret_shared_token_key_123!}
    volumes:
      - ./web/public/uploads:/app/uploads:ro
      - insightface_models:/app/models/insightface_models
      - ./ml/app:/app/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request, sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8000/health\").getcode() == 200 else 1)'"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 5s
    networks:
      chege-network:
        aliases:
          - ml
          - ml-chege-photos
    restart: unless-stopped

volumes:
  mysql-data:
  qdrant_data:
  insightface_models:
  redis-data:
  web-vendor:

networks:
  chege-network:
    name: chege-network
