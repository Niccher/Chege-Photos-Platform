site_name: ML Chege Photos Documentation
site_description: Engineering & User documentation for ML Chege Photos (FastAPI, Qdrant, InsightFace, YOLOv8, CLIP)
theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: README.md
  - User Guide:
      - Setup & Run: user/setup-and-run.md
      - Configuration: user/configuration.md
      - Troubleshooting: user/troubleshooting.md
  - Architecture:
      - Overview: architecture/overview.md
      - Communication: architecture/communication.md
      - Data & Storage: architecture/data-and-storage.md
      - Deployment: architecture/deployment.md
      - Threat Model: architecture/threat-model.md
  - API Reference:
      - REST Contract: api/contract.md
  - Services:
      - FastAPI: services/fastapi.md
      - ML & Vision Pipelines: services/ml.md
  - Engineering:
      - Local Development: engineering/local-development.md
      - Making Changes: engineering/making-changes.md
      - Testing: engineering/testing.md
      - CI/CD: engineering/ci.md
      - Contributing: engineering/contributing.md
      - Troubleshooting: engineering/troubleshooting.md
      - Security: engineering/security.md
      - Release Train: engineering/release.md
  - Runbooks:
      - Restart & Recovery: runbooks/restart.md
      - Backup & Restore: runbooks/backup-and-restore.md
  - Architecture Decision Records:
      - "0004: Decoupled ML Microservice": adr/0004-decoupled-microservice-ml.md
