version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/web"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/ml"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "composer"
    directory: "/web"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "php"

  - package-ecosystem: "pip"
    directory: "/ml"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"
